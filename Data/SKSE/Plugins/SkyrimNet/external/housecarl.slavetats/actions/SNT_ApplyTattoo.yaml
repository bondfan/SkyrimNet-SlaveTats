name: SNT_ApplyTattoo
description: |
  Apply one random installed tattoo to the player using an available category and position.
  Use only the category/position combinations listed in the current tattoo choices.
  The exact design is selected randomly. Stay vague before application, such as
  "I'll mark you as you deserve it." Do not promise specific writing or imagery.
  This action unequips eligible clothing and drops it on the ground. Jewelry,
  weapons, shields, quest items, and SexLabNoStrip items are excluded.
  Application can fail. Only explicit post-application narration confirms the result.
questEditorId: SNT_MainQuest
scriptName: SNT_Main
executionFunctionName: ApplyTattoo
parameterMapping:
  - type: speaker
    name: akInitiator
  - type: dynamic
    name: asCategory
    description: Choose an available tattoo category exactly as listed.
  - type: dynamic
    name: asPosition
    description: Choose a position listed for that category. All Over is a specific position.
eligibilityRules:
  - conditions:
      - decoratorName: papyrus_util
        arguments: [GetIntValue, none, SNT_ApplyReady, 0]
        comparisonOperator: "=="
        expectedValue: 1
    logicalOperator: AND
    required: true
enabled: true
defaultPriority: 5
